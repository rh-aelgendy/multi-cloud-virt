---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- "../../base"
labels:
- pairs:
    cloud: azure
  includeTemplates: true
patches:
- target:
    kind: VirtualMachine
    name: team-x-linux
  patch: '[{"op": "replace", "path": "/spec/template/spec/hostname", "value": "teamx-azure"},
    {"op": "replace", "path": "/spec/dataVolumeTemplates/0/spec/storage/storageClassName",
    "value": "anf"}, {"op": "add", "path": "/spec/template/spec/nodeSelector", "value":
    {"workload": "virt"}}]'
