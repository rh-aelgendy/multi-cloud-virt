---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: windows-factory
  namespace: image-factory
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: windows-factory
  namespace: image-factory
spec:
  runPolicy: Serial
  source:
    type: Dockerfile
    dockerfile: |
      # Use an ose-cli image matching the build cluster. Pin images by digest before rehearsal.
      ARG CLI_IMAGE=registry.redhat.io/openshift4/ose-cli:latest
      FROM ${CLI_IMAGE} AS cli
      FROM registry.access.redhat.com/ubi9/ubi:9.6
      RUN dnf install -y python3 ca-certificates && dnf clean all
      COPY --from=cli /usr/bin/oc /usr/local/bin/oc
      ENV HOME=/tmp PYTHONDONTWRITEBYTECODE=1
      WORKDIR /tmp
      USER 1001
  strategy:
    type: Docker
    dockerStrategy:
      buildArgs:
      - name: CLI_IMAGE
        value: registry.redhat.io/openshift4/ose-cli-rhel9:v4.21
  output:
    to:
      kind: ImageStreamTag
      name: windows-factory:demo
  triggers: []
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
