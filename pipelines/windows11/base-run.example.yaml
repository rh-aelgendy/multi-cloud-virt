---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: windows11-base-image-
  namespace: image-factory
spec:
  pipelineRef:
    name: windows11-base-image
  taskRunTemplate:
    serviceAccountName: image-builder
    podTemplate:
      nodeSelector:
        workload: virt
  params:
  - name: build-id
    value: win11-base-build1
  - name: image-name
    value: win11-base-v1-0-0
  - name: image-version
    value: v1.0.0
  - name: source-image
    value: win11-base-v1-0-0
  - name: iso-dv-name
    value: win11-pro-install-media
  - name: windows-edition
    value: Windows 11 Pro
  - name: accept-eula
    value: 'false'
  - name: iso-url
    value: REPLACE_WITH_WINDOWS11_ISO_HTTPS_URL
  timeouts:
    pipeline: 4h
  taskRunSpecs:
  - pipelineTaskName: modify-windows-iso-file
    podTemplate:
      nodeSelector:
        workload: virt
      securityContext:
        runAsUser: 107
        fsGroup: 107
