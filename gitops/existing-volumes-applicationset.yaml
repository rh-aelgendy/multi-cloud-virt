---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-x-existing-volumes
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - list:
      elements:
      - cluster: acm-hub-aro
        overlay: aro
      - cluster: rosa-virt-dr
        overlay: rosa
  template:
    metadata:
      name: team-x-linux-{{.overlay}}
    spec:
      project: team-x-vms
      source:
        repoURL: https://github.com/rh-aelgendy/multi-cloud-virt.git
        targetRevision: main
        path: vm/linux/overlays/{{.overlay}}
      destination:
        name: "{{.cluster}}"
        namespace: team-x
      ignoreDifferences:
      - group: kubevirt.io
        kind: VirtualMachine
        name: team-x-linux
        namespace: team-x
        jqPathExpressions:
        - '.spec.template.spec.volumes[]? | select(.name == "cloudinit") | .cloudInitNoCloud.userData'
      syncPolicy:
        syncOptions:
        - RespectIgnoreDifferences=true
        automated:
          selfHeal: true
          prune: false
          enabled: true
  syncPolicy:
    preserveResourcesOnDeletion: true
